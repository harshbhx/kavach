name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests, offline run)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra live
      - run: make check
      - run: make smoke

  gate:
    name: Kavach CI gate (the reusable action, hardened config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kavach-ci
        with:
          prompt: data/ci/hardened_prompt.md
          policy: data/ci/hardened_policy.json
          baseline: data/ci/baseline.json

  web:
    name: Web apps (lint, types, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint --filter=@kavach/web --filter=@kavach/dashboard
      - run: pnpm turbo run build --filter=@kavach/web --filter=@kavach/dashboard
