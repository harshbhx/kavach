name: Deploy site

# Builds the landing page, the docs and the in-browser dashboard demo as a static site and serves it from
# Cloudflare (Workers static assets). Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Without them the build still runs, so a broken static export is caught, and the deploy step is skipped.

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "docs/**"
      - "runs/*.jsonl"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    name: Cloudflare (landing, docs, dashboard demo)
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Social cards need the site's absolute address. Use the SITE_URL repository variable when it is set,
      # otherwise ask Cloudflare for the account's workers.dev subdomain.
      - name: Work out the site address
        id: url
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ] && [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            sub=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" | jq -r '.result.subdomain // empty' || true)
            if [ -n "$sub" ]; then SITE_URL="https://kavach.$sub.workers.dev"; fi
          fi
          echo "site=$SITE_URL" >> "$GITHUB_OUTPUT"
          echo "Site address: ${SITE_URL:-unknown, social cards will use a placeholder}"

      - name: Build the static site
        run: pnpm --filter @kavach/web build:cf
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.url.outputs.site }}

      - name: Deploy to Cloudflare
        id: deploy
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          packageManager: pnpm
          command: deploy

      - name: Summary
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.deployment-url || steps.url.outputs.site }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "### Kavach is live" >> "$GITHUB_STEP_SUMMARY"
            echo "- Site: $URL" >> "$GITHUB_STEP_SUMMARY"
            echo "- Dashboard demo: $URL/dashboard/?demo=sample" >> "$GITHUB_STEP_SUMMARY"
            echo "- Docs: $URL/docs" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::Static build passed. Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy it."
          fi
