<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><style>
.kv-chev{animation:kvStrike 2.8s cubic-bezier(.3,.7,.2,1) infinite}
.kv-bar{animation:kvFlash 2.8s ease infinite}
.kv-spark{transform-origin:46.5px 64px;animation:kvSpark 2.8s ease-out infinite}
@keyframes kvStrike{0%{transform:translateX(34px);opacity:0}28%{transform:translateX(0);opacity:1}36%{transform:translateX(7px)}46%,82%{transform:translateX(0);opacity:1}100%{transform:translateX(34px);opacity:0}}
@keyframes kvFlash{0%,26%{fill:#22D3EE}30%{fill:#FFFFFF}44%,100%{fill:#22D3EE}}
@keyframes kvSpark{0%,26%{transform:scale(0);opacity:0}30%{transform:scale(1);opacity:1}50%,100%{transform:scale(1.9);opacity:0}}
@media (prefers-reduced-motion:reduce){.kv-chev,.kv-bar,.kv-spark{animation:none}.kv-spark{opacity:0}}
</style>
<rect class="kv-bar" x="25.5" y="22" width="18" height="84" rx="9" fill="#22D3EE"/>
<g class="kv-chev"><polyline points="93.5,24 55.5,64 93.5,104" fill="none" stroke="#FF4D6D" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/></g>
<circle class="kv-spark" cx="46.5" cy="64" r="9" fill="none" stroke="#FFB020" stroke-width="3.5"/></svg>
